<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="980" height="560" fill="#0b0f14"/>

  <!-- ================= out of scope band ================= -->
  <rect x="24" y="24" width="932" height="96" rx="10" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="44" y="52" fill="#94a3b8" font-size="12.5" font-weight="700" letter-spacing="0.08em">OUT OF SCOPE — PLATFORM RESPONSIBILITY</text>
  <text x="44" y="76" fill="#64748b" font-size="13">Measured boot and a TPM quote produce the firmware measurement (NIST SP 800-193; TCG remote attestation).</text>
  <text x="44" y="98" fill="#64748b" font-size="13">In this demo a device simulator supplies that measurement directly. NightSeal is the transparency layer above this boundary.</text>

  <!-- ================= private side ================= -->
  <text x="44" y="158" fill="#f59e0b" font-size="12.5" font-weight="700" letter-spacing="0.08em">PRIVATE — NEVER LEAVES THE DEVICE</text>

  <rect x="40" y="172" width="250" height="112" rx="10" fill="#121822" stroke="#3b2f14" stroke-width="1.5"/>
  <text x="60" y="199" fill="#e8eef7" font-size="14.5" font-weight="650">Device / vendor</text>
  <text x="60" y="223" fill="#93a3b8" font-size="12.5">firmware measurement</text>
  <text x="60" y="243" fill="#93a3b8" font-size="12.5">blinding randomness</text>
  <text x="60" y="263" fill="#93a3b8" font-size="12.5">Merkle path to its leaf</text>

  <rect x="40" y="308" width="250" height="92" rx="10" fill="#121822" stroke="#3b2f14" stroke-width="1.5"/>
  <text x="60" y="335" fill="#e8eef7" font-size="14.5" font-weight="650">Registry operator</text>
  <text x="60" y="359" fill="#93a3b8" font-size="12.5">approved firmware list</text>
  <text x="60" y="379" fill="#93a3b8" font-size="12.5">issues commitments + paths</text>

  <!-- proof server -->
  <rect x="352" y="196" width="216" height="92" rx="10" fill="#121822" stroke="#24303f" stroke-width="1.5"/>
  <text x="372" y="223" fill="#e8eef7" font-size="14.5" font-weight="650">Proof server</text>
  <text x="372" y="246" fill="#93a3b8" font-size="12.5">localhost:6300, in Docker</text>
  <text x="372" y="266" fill="#93a3b8" font-size="12.5">builds the ZK proof locally</text>

  <line x1="292" y1="228" x2="346" y2="228" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="296" y="220" fill="#64748b" font-size="11">secrets</text>

  <!-- boundary line -->
  <line x1="600" y1="140" x2="600" y2="520" stroke="#22c55e" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="612" y="158" fill="#22c55e" font-size="12.5" font-weight="700" letter-spacing="0.06em">PUBLIC FROM HERE ON</text>

  <line x1="570" y1="242" x2="672" y2="242" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <text x="576" y="232" fill="#22c55e" font-size="11">proof only</text>

  <!-- ================= chain ================= -->
  <rect x="672" y="172" width="270" height="184" rx="10" fill="#121822" stroke="#14331f" stroke-width="1.5"/>
  <text x="692" y="199" fill="#e8eef7" font-size="14.5" font-weight="650">NightSeal contract</text>
  <text x="692" y="217" fill="#64748b" font-size="11.5">Midnight Preview</text>

  <text x="692" y="245" fill="#22c55e" font-size="12.5">approvedSet — Merkle root</text>
  <text x="692" y="245" fill="#22c55e" font-size="12.5"> </text>
  <text x="692" y="265" fill="#93a3b8" font-size="11.5">leaves are opaque commitments</text>
  <text x="692" y="291" fill="#22c55e" font-size="12.5">baselineEpoch</text>
  <text x="692" y="313" fill="#22c55e" font-size="12.5">deviceStatus / deviceEpoch</text>
  <text x="692" y="337" fill="#ef4444" font-size="11.5">no hash · no version · no SBOM</text>

  <!-- indexer + dashboard -->
  <rect x="672" y="392" width="270" height="76" rx="10" fill="#121822" stroke="#24303f" stroke-width="1.5"/>
  <text x="692" y="419" fill="#e8eef7" font-size="14.5" font-weight="650">Auditor dashboard</text>
  <text x="692" y="442" fill="#93a3b8" font-size="12.5">reads the indexer — no wallet</text>
  <text x="692" y="460" fill="#93a3b8" font-size="12.5">anyone can verify compliance</text>

  <line x1="807" y1="360" x2="807" y2="386" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- operator write path -->
  <path d="M 290 352 C 460 352 470 470 660 430" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="360" y="398" fill="#64748b" font-size="11.5">approve / revoke — publishes commitments and moves the root</text>

  <!-- legend -->
  <text x="44" y="508" fill="#64748b" font-size="12">
    <tspan fill="#f59e0b" font-weight="700">Private</tspan> stays left of the line.
    <tspan fill="#22c55e" font-weight="700">Public</tspan> is only: a compliance yes/no, an epoch, and a root.
  </text>
  <text x="44" y="530" fill="#64748b" font-size="12">Revocation removes a leaf, which changes the root — so every proof built against the old baseline stops verifying.</text>
</svg>
