<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="980" height="560" fill="#0b0f14"/>

  <!-- ================= out of scope band ================= -->
  <rect x="24" y="24" width="932" height="96" rx="10" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="44" y="52" fill="#94a3b8" font-size="12.5" font-weight="700" letter-spacing="0.08em">OUT OF SCOPE — PLATFORM RESPONSIBILITY</text>
  <text x="44" y="76" fill="#64748b" font-size="13">Measured boot and a TPM quote produce the firmware measurement (NIST SP 800-193; TCG remote attestation).</text>
  <text x="44" y="98" fill="#64748b" font-size="13">In this demo a device simulator supplies that measurement directly. NightSeal is the transparency layer above this boundary.</text>

  <!-- ================= private side ================= -->
  <text x="44" y="158" fill="#f59e0b" font-size="12.5" font-weight="700" letter-spacing="0.08em">PRIVATE WITNESSES — NEVER REACH THE CHAIN</text>

  <rect x="40" y="172" width="250" height="132" rx="10" fill="#121822" stroke="#3b2f14" stroke-width="1.5"/>
  <text x="60" y="199" fill="#e8eef7" font-size="14.5" font-weight="650">Device / vendor</text>
  <text x="60" y="221" fill="#93a3b8" font-size="12">registered device secret</text>
  <text x="60" y="241" fill="#93a3b8" font-size="12">firmware measurement + opening</text>
  <text x="60" y="261" fill="#93a3b8" font-size="12">private 3-component manifest</text>
  <text x="60" y="281" fill="#93a3b8" font-size="12">firmware + component Merkle paths</text>

  <rect x="40" y="326" width="250" height="96" rx="10" fill="#121822" stroke="#3b2f14" stroke-width="1.5"/>
  <text x="60" y="353" fill="#e8eef7" font-size="14.5" font-weight="650">Registry operator</text>
  <text x="60" y="377" fill="#93a3b8" font-size="12">firmware + component policies</text>
  <text x="60" y="397" fill="#93a3b8" font-size="12">device enrollment commitments</text>

  <!-- proof server -->
  <rect x="352" y="206" width="216" height="104" rx="10" fill="#121822" stroke="#24303f" stroke-width="1.5"/>
  <text x="372" y="233" fill="#e8eef7" font-size="14.5" font-weight="650">One ZK attestation</text>
  <text x="372" y="256" fill="#93a3b8" font-size="12">1 · registered device secret</text>
  <text x="372" y="276" fill="#93a3b8" font-size="12">2 · current firmware capability</text>
  <text x="372" y="296" fill="#93a3b8" font-size="12">3 · all component capabilities</text>

  <line x1="292" y1="248" x2="346" y2="248" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="296" y="240" fill="#64748b" font-size="11">secrets</text>

  <!-- boundary line -->
  <line x1="600" y1="140" x2="600" y2="520" stroke="#22c55e" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="612" y="158" fill="#22c55e" font-size="12.5" font-weight="700" letter-spacing="0.06em">PUBLIC FROM HERE ON</text>

  <line x1="570" y1="258" x2="672" y2="258" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <text x="576" y="248" fill="#22c55e" font-size="11">proof only</text>

  <!-- ================= chain ================= -->
  <rect x="672" y="172" width="270" height="210" rx="10" fill="#121822" stroke="#14331f" stroke-width="1.5"/>
  <text x="692" y="199" fill="#e8eef7" font-size="14.5" font-weight="650">NightSeal contract</text>
  <text x="692" y="217" fill="#64748b" font-size="11.5">Midnight Preview</text>

  <text x="692" y="245" fill="#22c55e" font-size="12.5">firmware capability root</text>
  <text x="692" y="267" fill="#22c55e" font-size="12.5">component capability root</text>
  <text x="692" y="289" fill="#93a3b8" font-size="11.5">both contain opaque commitments</text>
  <text x="692" y="315" fill="#22c55e" font-size="12.5">registered device-key commitments</text>
  <text x="692" y="337" fill="#22c55e" font-size="12.5">policyEpoch · status · deviceEpoch</text>
  <text x="692" y="361" fill="#ef4444" font-size="11.5">no firmware · component graph · SBOM</text>

  <!-- indexer + dashboard -->
  <rect x="672" y="414" width="270" height="76" rx="10" fill="#121822" stroke="#24303f" stroke-width="1.5"/>
  <text x="692" y="441" fill="#e8eef7" font-size="14.5" font-weight="650">Auditor dashboard</text>
  <text x="692" y="464" fill="#93a3b8" font-size="12.5">reads the indexer — no wallet</text>
  <text x="692" y="482" fill="#93a3b8" font-size="12.5">verifies results, not composition</text>

  <line x1="807" y1="386" x2="807" y2="408" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- operator write path -->
  <path d="M 290 372 C 430 372 520 350 660 350" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="338" y="405" fill="#64748b" font-size="11.5">revoke one component → only dependent firmware loses proof power</text>

  <!-- legend -->
  <text x="44" y="508" fill="#64748b" font-size="12">
    <tspan fill="#f59e0b" font-weight="700">Private</tspan> stays left of the line.
    <tspan fill="#22c55e" font-weight="700">Public</tspan> is only: identity commitments, compliance, an epoch, and two roots.
  </text>
  <text x="44" y="530" fill="#64748b" font-size="12">Component revocation changes no firmware leaf; the private circuit discovers which bound manifests can no longer satisfy the current root.</text>
</svg>
